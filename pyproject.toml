[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-radar"
version = "0.1.0"
description = "Multi-source job ingestion system"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[project.scripts]
job-radar = "job_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E", "W",  # pycodestyle
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # missing annotations
    "S",    # bandit
    "B",    # bugbear
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "DTZ",  # naive datetime usage
    "T20",  # print statements
    "PT",   # pytest style
    "SIM",  # simplification
    "PTH",  # pathlib over os.path
    "ARG",  # unused arguments
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert (S101) and hardcoded credentials against local fixtures.
"tests/**" = ["S101", "S105", "S106"]
# Alembic generates this layout; the mako template is not importable Python.
"migrations/versions/*" = ["ANN"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# `tests` is a first-party package (it holds shared test support), not a
# third-party dependency.
known-first-party = ["job_radar", "tests"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
show_error_codes = true

[[tool.mypy.overrides]]
# Alembic's runtime-generated attributes are not typed upstream.
module = "alembic.*"
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live PostgreSQL instance (docker compose up -d)",
]
